[project]
name = "fdg"
version = "0.0.1a"
authors = [{ name = "Jan Roth", email = "r0th.j4n@gmail.com" }]
description = "Finite Differential Geometry library for Python."
requires-python = ">=3.11"
dependencies = [
    "hybsol",
    "numpy>=2.0.0",
    "pillow>=10.0",
    "pyvista>=0.48.4",
    "scipy>=1.17.1",
]


[tool.uv.sources]
# The block solver is a submodule of this repository; build it from the
# checkout so the two move together.
hybsol = { path = "hybridized-solver", editable = true }


[build-system]
requires = ["scikit-build-core", "numpy"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# cmake.verbose = true
cmake.build-type = "Release"
cmake.source-dir = "."
build.verbose = true
logging.level = "INFO"
editable.verbose = true
editable.rebuild = false


[dependency-groups]
dev = [
    "build",
    "scikit-build-core",
    "pyrefly",
    "npt-promote",
    "pytest>=9.0.3",
    "pytest-cov",
    "interrogate",
    "pre-commit",
    "codespell",
    "tomli",
    "ruff>=0.16.6",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-favicon",
    "sphinx-design",
    "sphinx-gallery",
    "pypandoc",
    "pytest-sphinx",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-toolbox",
    "sphinxcontrib-websupport",
    "sphinxcontrib-asciinema",
    "jupyter-sphinx",
    "matplotlib",
    "hawkmoth>=0.22.0",
    "libclang>=18.1.1",
]


[tool.pyrefly]
project-includes = ["python/fdg/**/*.py", "python/fdg/**/*.pyi"]
use-ignore-files = true
search-path = ["python/fdg"]
ignore-missing-imports = ["*"]


[tool.codespell]
skip = "sandbox/*"
count = true

[tool.ruff]
exclude = [
    ".venv",
    ".nox",
    ".pytest_cache",
    ".vscode",
    "doc",
    "hybridized-solver",
]
line-length = 90

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.ruff.lint]
select = ["E", "W", "D", "I", "F", "ARG", "A", "FA", "ICN", "TID"]
ignore = ["ARG002"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest]
addopts = ["--doctest-modules", "-ra", "--cov=fdg", "--ignore=hybridized-solver/cpyutl"]
testpaths = ["tests", "src"]
console_output_style = "count"

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


[tool.interrogate]
ignore-init-method = true
fail-under = 100
exclude = ["sandbox", "doc", "build", ".*/", "cmake-*/"]
style = "sphinx"
verbose = 1
